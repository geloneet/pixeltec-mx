# ==================================================================
# Pixeltec.mx (CRM) — docker-compose.yml
# ==================================================================
# Este compose gestiona la app Next.js del CRM + su base de datos Postgres
# (migración en curso hacia Postgres+Drizzle+NextAuth — ver
# docs/superpowers/plans/2026-07-07-firebase-to-postgres-drizzle-nextauth-migration.md).
# Nginx y Certbot viven en pixeltec-infra/docker-compose.yml.
#
# `app` habla con nginx/otros containers por `web-network` (external) y con
# `db` por la red interna dedicada `pixeltec-mx-internal` (NO expuesta a
# web-network — ningún otro container del VPS puede alcanzar la DB).
#
# Operaciones:
#   - Rebuild + deploy:  docker compose build --no-cache app && docker compose up -d app
#   - Logs:              docker compose logs -f app
#   - Restart:           docker compose restart app
#   - Migraciones:       docker compose --profile tools run --rm migrator
#   - Seed inicial:      docker compose --profile tools run --rm seed
# ==================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # El contrato E0 entra al build SOLO como BuildKit secret (M1A):
      # nunca por contexto (.dockerignore lo excluye) ni por ARG/ENV.
      secrets:
        - env_production
    # Imagen etiquetada por commit (E0g-3): el pipeline exporta
    # PIXELTEC_MX_IMAGE_TAG=<sha> para build/up; sin exportar cae a `latest`,
    # que solo se mueve tras health OK. Permite rollback real sin rebuild.
    image: pixeltec-mx-app:${PIXELTEC_MX_IMAGE_TAG:-latest}
    container_name: pixeltec-mx
    restart: unless-stopped
    # PIXELTEC_MX_ENV_FILE: ruta canónica absoluta que fija el motor de deploy
    # (release inmutable, M1A); sin definirla cae al relativo de siempre (dev).
    env_file:
      - ${PIXELTEC_MX_ENV_FILE:-.env.production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web-network
      - pixeltec-mx-internal

  db:
    container_name: pixeltec-mx-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixeltec_mx
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pixeltec_mx
    volumes:
      - pixeltec-mx-db-data:/var/lib/postgresql/data
    # Solo 127.0.0.1 (regla de seguridad de puertos del VPS, ver
    # pixeltec-infra/runbooks/docker-port-hardening.md): permite que
    # `npm run dev` en el host (dev.pixeltec.mx) alcance la DB sin exponerla
    # a la red pública — Docker bypasea ufw vía PREROUTING DNAT si el bind
    # fuera 0.0.0.0.
    ports:
      - "127.0.0.1:${PIXELTEC_MX_DB_PORT:-5437}:5432"
    networks:
      - pixeltec-mx-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixeltec_mx"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Tools (bajo demanda: docker compose --profile tools run --rm <servicio>) ──
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    command: ["npx", "drizzle-kit", "migrate"]
    env_file: ${PIXELTEC_MX_ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pixeltec-mx-internal
    profiles:
      - tools

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    command: ["npx", "tsx", "scripts/seed.ts"]
    env_file: ${PIXELTEC_MX_ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pixeltec-mx-internal
    profiles:
      - tools

# Fuente del BuildKit secret del build de `app` (M1A): la ruta canónica la
# fija el motor de deploy; en dev cae al archivo relativo si existiera.
secrets:
  env_production:
    file: ${PIXELTEC_MX_ENV_FILE:-.env.production}

networks:
  web-network:
    external: true
  pixeltec-mx-internal:
    driver: bridge

volumes:
  pixeltec-mx-db-data:
